name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. 1.2.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  autotag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag the declared version and dispatch the release, if missing
        run: |
          VERSION=$(sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' chart/Chart.yaml)
          if [ -z "$VERSION" ]; then
            echo "no appVersion found in chart/Chart.yaml"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "tag v$VERSION already exists, nothing to do"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yaml/dispatches" \
            -d '{"ref":"${{ github.sha }}","inputs":{"version":"'"$VERSION"'"}}'

  docker:
    if: github.event_name != 'workflow_dispatch' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tags=ghcr.io/${{ github.repository }}:${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ steps.meta.outputs.tags }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max