apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: tinfoil-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3302
          env:
            - name: TINFOIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tinfoil.existingSecret }}
                  key: {{ .Values.tinfoil.apiKeyKey }}
            - name: TINFOIL_MODELS
              value: {{ .Values.models | quote }}
            - name: REQUEST_TIMEOUT
              value: {{ .Values.timeout | quote }}
            - name: EMBED_BATCH_SIZE
              value: {{ .Values.embedBatchSize | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3302
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3302
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3302